<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% load static %}
    <script src="{% static 'jquery-3.6.0.js' %}"></script>
    <link rel="stylesheet" href="{% static 'bootstrap-4.6.2-dist/css/bootstrap.min.css' %}">
    <script src="{% static 'bootstrap-4.6.2-dist/js/bootstrap.min.js' %}"></script>
    <title>Document</title>
</head>
<body class="bg-dark">
    <p class="text-center">List</p>
    <div class="container">
        <div class="row">
            <div class="col-mk-8 offset-4">
                <table class="table table-striped table-hover table-responsive-xl table-info">
                    <thead>
                    <tr>
                        <th>id</th>
                        <th>userbane</th>
                        <th>password</th>
                        <th>edit</th>
                        <th>delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    {% for user in user_list %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.password }}</td>
                            <td>
                                <a href="{% url 'edit' %}?user_id={{ user.id }}" class="btn btn-success btn-sm">修改</a>
                            </td>
                            <td>
                                <a href="" class="btn btn-warning btn-sm">刪除</a>
                            </td>
                        </tr>
                    {% endfor %}

                    </tbody>

                </table>

            </div>
        </div>
    </div>
</body>
</html>
